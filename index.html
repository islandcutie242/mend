<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fef3e8" />
<title>Mend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fef7ee;
    --bg-soft: #fef3e8;
    --surface: #ffffff;
    --ink: #2a1a0f;
    --ink-soft: #6b5544;
    --ink-mute: #9c8773;
    --border: #f0e3d2;
    --border-strong: #e3d0b8;
    --accent: #c2410c;
    --accent-soft: #fed7aa;
    --accent-bg: #fff7ed;
    --accent-ink: #7c2d12;
  }

  body.mood-heavy {
    --accent: #6366f1; --accent-soft: #c7d2fe; --accent-bg: #eef2ff; --accent-ink: #3730a3;
    --bg: #f5f6fb; --bg-soft: #eef0f9;
  }
  body.mood-meh {
    --accent: #0891b2; --accent-soft: #a5f3fc; --accent-bg: #ecfeff; --accent-ink: #155e75;
  }
  body.mood-okay {
    --accent: #c2410c; --accent-soft: #fed7aa; --accent-bg: #fff7ed; --accent-ink: #7c2d12;
  }
  body.mood-good {
    --accent: #d97706; --accent-soft: #fde68a; --accent-bg: #fffbeb; --accent-ink: #78350f;
    --bg: #fffbeb; --bg-soft: #fef3c7;
  }
  body.cycle-period, body.cycle-pms {
    --accent: #be185d; --accent-soft: #fbcfe8; --accent-bg: #fdf2f8; --accent-ink: #831843;
  }
  body.unwell {
    --accent: #7c3aed; --accent-soft: #ddd6fe; --accent-bg: #f5f3ff; --accent-ink: #5b21b6;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); font-family: 'Inter', -apple-system, sans-serif; color: var(--ink); min-height: 100vh; min-height: 100dvh; transition: background 0.4s ease; }
  body { padding-bottom: env(safe-area-inset-bottom); padding-top: env(safe-area-inset-top); }
  .app { max-width: 480px; margin: 0 auto; padding: 24px 20px 56px; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; }
  textarea, input { font-family: inherit; }

  /* Header / wordmark */
  .wordmark-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .wordmark {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 32px; font-weight: 600;
    letter-spacing: -0.02em; color: var(--accent);
    line-height: 1;
  }
  .wordmark-dot {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--accent);
    margin-left: 2px; vertical-align: 4px;
  }
  .tagline {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 13px; font-style: italic;
    color: var(--ink-mute); margin-top: 2px;
    letter-spacing: 0.01em;
  }
  .header-actions {
    display: flex; gap: 6px;
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--border);
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .icon-btn:active { transform: scale(0.94); background: var(--bg-soft); }
  .icon-btn svg { width: 16px; height: 16px; stroke: var(--ink-soft); stroke-width: 1.6; fill: none; }

  .eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); font-weight: 500; }
  .greeting {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 26px; font-weight: 500; line-height: 1.15;
    color: var(--ink); letter-spacing: -0.01em;
  }
  .date-sub { font-size: 14px; color: var(--ink-soft); margin-top: 6px; line-height: 1.5; }
  .h2 { font-family: 'Fraunces', Georgia, serif; font-size: 20px; font-weight: 500; }
  .body { font-size: 15px; line-height: 1.6; color: var(--ink-soft); }
  .small { font-size: 13px; color: var(--ink-mute); }

  /* Top divider */
  .divider {
    height: 1px; background: var(--border);
    margin: 18px 0 20px;
  }

  /* Affirmation */
  .affirmation {
    background: var(--accent-bg); border: 1px solid var(--accent-soft);
    border-radius: 24px; padding: 22px 22px 18px;
    margin-bottom: 24px; position: relative; overflow: hidden;
  }
  .affirmation::before {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--accent-soft); opacity: 0.4; pointer-events: none;
  }
  .affirmation-eyebrow {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent-ink); opacity: 0.8; font-weight: 500;
    margin-bottom: 8px; position: relative;
  }
  .affirmation-text {
    font-family: 'Fraunces', Georgia, serif; font-size: 18px; line-height: 1.5;
    color: var(--accent-ink); font-weight: 500; position: relative;
  }
  .affirmation-source {
    font-size: 12px; color: var(--accent-ink); opacity: 0.65;
    margin-top: 10px; font-style: italic; position: relative;
  }

  /* Mini 7-day strip (subtle, no pressure) */
  .strip-section { margin-bottom: 24px; }
  .strip-label {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px;
  }
  .strip-label-text { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); font-weight: 500; }
  .strip-link { font-size: 12px; color: var(--accent); font-weight: 500; }
  .strip {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  }
  .strip-day {
    aspect-ratio: 1; border-radius: 8px; background: var(--bg-soft);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--ink-mute); position: relative;
  }
  .strip-day.has-mood-1 { background: #e0e7ff; border-color: #c7d2fe; }
  .strip-day.has-mood-2 { background: #cffafe; border-color: #a5f3fc; }
  .strip-day.has-mood-3 { background: #fed7aa; border-color: #fdba74; }
  .strip-day.has-mood-4 { background: #fde68a; border-color: #fcd34d; }
  .strip-day.has-cycle { background: #fbcfe8; border-color: #f9a8d4; }
  .strip-day.today {
    border: 2px solid var(--accent); font-weight: 600;
    color: var(--accent-ink);
  }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 16px 18px; width: 100%; text-align: left;
    display: flex; align-items: center; justify-content: space-between;
    transition: transform 0.12s ease, border-color 0.12s ease;
    box-shadow: 0 1px 2px rgba(42, 26, 15, 0.02);
  }
  .card:active { transform: scale(0.985); }
  .card.complete {
    background: linear-gradient(to right, var(--accent-bg), var(--surface));
    border-color: var(--accent-soft);
  }
  .card-row { display: flex; align-items: center; gap: 12px; }
  .icon-circle {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-soft); flex-shrink: 0;
  }
  .icon-circle.complete { background: var(--accent); }
  .icon-circle svg { width: 19px; height: 19px; stroke: var(--ink-soft); stroke-width: 1.6; fill: none; }
  .icon-circle.complete svg { stroke: white; }
  .card-title { font-size: 15px; font-weight: 500; color: var(--ink); }
  .card-status { font-size: 12px; color: var(--ink-mute); margin-top: 3px; }
  .card.complete .card-status { color: var(--accent-ink); }
  .check { width: 18px; height: 18px; stroke: var(--accent); stroke-width: 2.5; fill: none; }

  /* Buttons */
  .btn-primary {
    width: 100%; background: var(--ink); color: var(--bg);
    border-radius: 16px; padding: 16px; font-size: 15px; font-weight: 500;
    transition: transform 0.12s ease;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-accent {
    width: 100%; background: var(--accent); color: white;
    border-radius: 16px; padding: 16px; font-size: 15px; font-weight: 500;
    transition: transform 0.12s ease;
  }
  .btn-accent:active { transform: scale(0.98); }
  .btn-secondary {
    width: 100%; background: transparent; color: var(--ink-mute);
    padding: 8px; font-size: 13px;
  }
  .btn-outline {
    width: 100%; background: var(--surface); color: var(--ink);
    border: 1px solid var(--border-strong);
    border-radius: 16px; padding: 14px; font-size: 14px; font-weight: 500;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .btn-outline:active { transform: scale(0.98); background: var(--bg-soft); }

  .section { margin-top: 26px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }

  .unwell-toggle {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px dashed var(--border-strong);
    border-radius: 16px; padding: 12px 16px; margin-top: 14px;
    font-size: 13px; color: var(--ink-soft);
  }
  .unwell-toggle button { color: var(--accent); font-weight: 500; font-size: 13px; }
  body.unwell .unwell-toggle {
    background: var(--accent-bg); border-style: solid; border-color: var(--accent-soft);
  }

  /* Backup reminder banner */
  .backup-banner {
    background: var(--accent-bg); border: 1px solid var(--accent-soft);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 12px;
  }
  .backup-banner-icon {
    width: 32px; height: 32px; border-radius: 10px;
    background: var(--accent); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .backup-banner-icon svg { width: 16px; height: 16px; stroke: white; stroke-width: 1.8; fill: none; }
  .backup-banner-text { flex: 1; }
  .backup-banner-title { font-size: 13px; font-weight: 500; color: var(--accent-ink); }
  .backup-banner-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .backup-banner-btn {
    background: var(--accent); color: white;
    padding: 8px 14px; border-radius: 10px;
    font-size: 12px; font-weight: 500;
  }

  /* Back header */
  .back-header { display: flex; align-items: center; gap: 8px; margin: 0 -8px 22px; }
  .back-btn { padding: 8px; border-radius: 999px; transition: background 0.12s ease; }
  .back-btn:active { background: var(--bg-soft); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--ink); stroke-width: 1.6; fill: none; }

  /* Inputs */
  .input-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px; }
  .input-label { font-size: 13px; color: var(--ink-mute); margin-bottom: 6px; }
  textarea {
    width: 100%; background: transparent; color: var(--ink);
    border: none; outline: none; resize: none; font-size: 15px; line-height: 1.6;
  }
  textarea::placeholder { color: var(--ink-mute); opacity: 0.5; }

  /* Tap grids */
  .tap-grid { display: grid; gap: 10px; }
  .tap-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .tap {
    background: var(--surface); color: var(--ink-soft); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px 8px; font-size: 12px; font-weight: 500;
    transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    display: flex; align-items: center; justify-content: center; gap: 6px; flex-direction: column;
  }
  .tap.active { background: var(--accent); color: white; border-color: var(--accent); }
  .tap:active { transform: scale(0.96); }
  .tap svg { width: 19px; height: 19px; stroke-width: 1.6; fill: none; }

  /* Reset options */
  .reset-option {
    width: 100%; background: var(--surface); border: 2px solid var(--border); border-radius: 18px;
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .reset-option:active { transform: scale(0.985); }
  .reset-option.selected { border-color: var(--accent); background: var(--accent-bg); }
  .reset-option.recommended { border-color: var(--accent-soft); }
  .reset-option .badge {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    background: var(--accent); color: white; padding: 3px 8px; border-radius: 999px;
    margin-left: auto; font-weight: 500;
  }
  .reset-emoji { font-size: 22px; }
  .reset-label { font-size: 15px; color: var(--ink); flex: 1; text-align: left; }

  .prompt-card { background: var(--accent-bg); border: 1px solid var(--accent-soft); border-radius: 20px; padding: 18px; }
  .prompt-text { font-family: 'Fraunces', Georgia, serif; font-size: 17px; line-height: 1.5; color: var(--accent-ink); font-weight: 500; }

  /* Phases */
  .phase-btn {
    width: 100%; border-radius: 18px; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border: 2px solid; transition: transform 0.12s ease;
  }
  .phase-btn:active { transform: scale(0.985); }
  .phase-period { background: #fff1f2; border-color: #fecdd3; color: var(--ink); }
  .phase-period.active { background: #be123c; border-color: #be123c; color: #fff; }
  .phase-spot { background: #fff1f2; border-color: #fecdd3; color: var(--ink); }
  .phase-spot.active { background: #e11d48; border-color: #e11d48; color: #fff; }
  .phase-foll { background: #fffbeb; border-color: #fde68a; color: var(--ink); }
  .phase-foll.active { background: #b45309; border-color: #b45309; color: #fff; }
  .phase-ovu { background: #ecfdf5; border-color: #a7f3d0; color: var(--ink); }
  .phase-ovu.active { background: #047857; border-color: #047857; color: #fff; }
  .phase-lut { background: #f5f3ff; border-color: #ddd6fe; color: var(--ink); }
  .phase-lut.active { background: #6d28d9; border-color: #6d28d9; color: #fff; }
  .phase-pms { background: #f5f3ff; border-color: #ddd6fe; color: var(--ink); }
  .phase-pms.active { background: #7c3aed; border-color: #7c3aed; color: #fff; }
  .phase-label { font-size: 15px; font-weight: 500; }
  .phase-desc { font-size: 12px; opacity: 0.75; margin-top: 2px; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; text-align: center; }
  .stat-num { font-family: 'Fraunces', Georgia, serif; font-size: 28px; color: var(--accent); line-height: 1; font-weight: 500; }
  .stat-label { font-size: 11px; color: var(--ink-mute); margin-top: 6px; letter-spacing: 0.04em; }

  /* Calendar grid */
  .calendar-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px; margin-bottom: 16px; }
  .cal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-month {
    font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 500;
  }
  .cal-nav-btn {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-soft); transition: transform 0.12s ease, background 0.12s ease;
  }
  .cal-nav-btn:active { transform: scale(0.92); }
  .cal-nav-btn svg { width: 14px; height: 14px; stroke: var(--ink); stroke-width: 2; fill: none; }
  .cal-nav-btn:disabled { opacity: 0.3; cursor: default; }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
    margin-bottom: 8px;
  }
  .cal-wd {
    text-align: center; font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-mute); font-weight: 500;
  }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
  }
  .cal-day {
    aspect-ratio: 1; border-radius: 8px; background: var(--bg-soft);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 11px; color: var(--ink-mute); position: relative;
    border: 1px solid transparent;
    transition: transform 0.12s ease;
  }
  .cal-day.empty { background: transparent; }
  .cal-day.has-mood-1 { background: #e0e7ff; color: #3730a3; }
  .cal-day.has-mood-2 { background: #cffafe; color: #155e75; }
  .cal-day.has-mood-3 { background: #fed7aa; color: #7c2d12; }
  .cal-day.has-mood-4 { background: #fde68a; color: #78350f; }
  .cal-day.today { border-color: var(--accent); font-weight: 600; }
  .cal-day:active:not(.empty) { transform: scale(0.92); }
  .cal-dots { display: flex; gap: 2px; margin-top: 2px; }
  .cal-dot {
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
    opacity: 0.5;
  }
  .cal-dot.cycle { background: #be185d; }

  .cal-legend {
    display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px;
    padding-top: 14px; border-top: 1px solid var(--border);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-soft); }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; }

  /* Day detail popup-style card */
  .day-detail {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 18px; margin-bottom: 16px;
  }
  .day-detail-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .day-detail-date {
    font-family: 'Fraunces', Georgia, serif; font-size: 17px; font-weight: 500;
  }
  .day-detail-close {
    width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-soft);
  }
  .day-detail-close svg { width: 14px; height: 14px; stroke: var(--ink); stroke-width: 2; fill: none; }
  .day-row {
    display: flex; gap: 12px; padding: 8px 0;
    font-size: 14px; line-height: 1.5;
  }
  .day-row + .day-row { border-top: 1px solid var(--border); }
  .day-row-label { font-size: 12px; color: var(--ink-mute); width: 80px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 2px; }
  .day-row-value { flex: 1; color: var(--ink); }
  .day-row-value.empty { color: var(--ink-mute); font-style: italic; opacity: 0.6; }

  /* Chart card */
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px; margin-bottom: 12px; }
  .chart-bars { display: flex; align-items: flex-end; justify-content: space-between; gap: 4px; height: 80px; }
  .chart-bar { flex: 1; border-radius: 4px 4px 0 0; min-height: 3px; transition: opacity 0.2s ease; }
  .chart-bar.mood { background: var(--accent); }
  .chart-bar.energy { background: var(--accent-ink); }

  .note-card {
    background: var(--bg-soft); border-radius: 20px; padding: 18px;
    font-size: 13px; line-height: 1.6; color: var(--ink-soft);
  }

  /* Option grid */
  .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt {
    background: var(--surface); color: var(--ink-soft);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 14px; font-size: 14px; font-weight: 500;
    transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    position: relative;
  }
  .opt.active { background: var(--accent); color: white; border-color: var(--accent); }
  .opt.recommended { border-color: var(--accent-soft); }
  .opt:active { transform: scale(0.97); }
  .opt-dot {
    position: absolute; top: 8px; right: 8px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }

  /* Context chip */
  .context-line {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-bg); color: var(--accent-ink);
    border-radius: 999px; padding: 5px 12px;
    font-size: 12px; font-weight: 500; margin-top: 12px;
  }
  .context-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  /* Backup view specifics */
  .backup-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 18px; margin-bottom: 14px;
  }
  .backup-section h3 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 16px; font-weight: 500; margin: 0 0 6px;
  }
  .backup-section p { margin: 0 0 12px; font-size: 13px; color: var(--ink-soft); line-height: 1.55; }
  .data-preview {
    background: var(--bg-soft); border-radius: 12px;
    padding: 12px; font-size: 12px; color: var(--ink-soft);
    font-family: 'Inter', monospace; line-height: 1.6;
  }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0;
  }
  .toggle-row + .toggle-row { border-top: 1px solid var(--border); }
  .toggle-row-label { font-size: 14px; color: var(--ink); }
  .toggle-row-sub { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
  .toggle {
    width: 44px; height: 26px; border-radius: 999px;
    background: var(--border-strong); position: relative;
    transition: background 0.2s ease;
    flex-shrink: 0;
  }
  .toggle.on { background: var(--accent); }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%; background: white;
    transition: transform 0.2s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }
  .toggle.on::after { transform: translateX(18px); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg);
    padding: 12px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 500;
    box-shadow: 0 8px 24px rgba(42, 26, 15, 0.2);
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2.4s forwards;
    z-index: 100;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes toastOut { to { opacity: 0; transform: translate(-50%, 12px); } }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  .app > * { animation: fadeIn 0.3s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="app" class="app"></div>
<input type="file" id="importFile" accept="application/json" style="display:none" />

<script>
  const STORAGE_KEY = 'mend_entries_v3';
  const STATE_KEY = 'mend_state_v3';

  function loadEntries() {
    try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : {}; }
    catch (e) { return {}; }
  }
  function saveEntries(entries) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch (e) {}
  }
  function loadFlags() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      return raw ? JSON.parse(raw) : { unwell: false, unwellDate: null, lastBackup: null, reminderOn: true };
    } catch (e) { return { unwell: false, unwellDate: null, lastBackup: null, reminderOn: true }; }
  }
  function saveFlags(f) { try { localStorage.setItem(STATE_KEY, JSON.stringify(f)); } catch (e) {} }
  function todayKey() { return new Date().toISOString().split('T')[0]; }

  let state = {
    view: 'home',
    entries: loadEntries(),
    flags: loadFlags(),
    calMonth: new Date(),
    selectedDay: null,
  };

  if (state.flags.unwell && state.flags.unwellDate !== todayKey()) {
    state.flags = { ...state.flags, unwell: false, unwellDate: null };
    saveFlags(state.flags);
  }

  function getToday() { return state.entries[todayKey()] || {}; }
  function updateToday(updates) {
    const k = todayKey();
    state.entries[k] = { ...getToday(), ...updates };
    saveEntries(state.entries);
    render();
  }
  function toggleUnwell() {
    state.flags.unwell = !state.flags.unwell;
    state.flags.unwellDate = state.flags.unwell ? todayKey() : null;
    saveFlags(state.flags);
    render();
  }
  function go(view) { state.view = view; state.selectedDay = null; render(); }

  // Show backup reminder if it's been 7+ days since last backup
  function shouldShowBackupReminder() {
    if (!state.flags.reminderOn) return false;
    if (Object.keys(state.entries).length < 3) return false;
    if (!state.flags.lastBackup) return true;
    const last = new Date(state.flags.lastBackup);
    const days = Math.floor((Date.now() - last.getTime()) / (1000 * 60 * 60 * 24));
    return days >= 7;
  }

  // ============ AFFIRMATIONS ============
  const affirmations = {
    morning: [
      { text: "Whatever the mind can conceive and believe, it can achieve. Start small today.", src: "Inspired by Napoleon Hill" },
      { text: "You are the master of your fate; you are the captain of your soul.", src: "William Ernest Henley" },
      { text: "Begin, and the work itself will reveal what's next. You don't need the whole map.", src: "Stoic principle" },
      { text: "Today doesn't have to be everything. It only has to be something.", src: "Modern wisdom" },
      { text: "The man who moves a mountain begins by carrying away small stones.", src: "Confucius" },
    ],
    heavy: [
      { text: "When everything feels heavy, the answer isn't to lift more. It's to set something down.", src: "Modern wisdom" },
      { text: "Between stimulus and response, there is a space. In that space lies your freedom.", src: "Inspired by Viktor Frankl" },
      { text: "You don't have to feel ready. You only have to take one small step.", src: "Modern wisdom" },
      { text: "Rest is not the opposite of progress. It's part of it.", src: "Modern wisdom" },
      { text: "The wound is the place where the light enters you.", src: "Rumi" },
      { text: "This too shall pass. Not because you forced it, but because nothing stays.", src: "Ancient wisdom" },
    ],
    meh: [
      { text: "Action precedes motivation, not the other way around. Move first, feel after.", src: "Behavioral wisdom" },
      { text: "A flat day isn't a failed day. It's just a day.", src: "Modern wisdom" },
      { text: "You don't have to feel inspired to be productive. Showing up is the discipline.", src: "Mindset wisdom" },
      { text: "The mind is everything. What you think, you become.", src: "Inspired by the Buddha" },
      { text: "Small daily improvements are the key to staggering long-term results.", src: "Inspired by James Clear" },
    ],
    okay: [
      { text: "Definite purpose is the starting point of all achievement. Pick one thing.", src: "Inspired by Napoleon Hill" },
      { text: "Discipline is choosing between what you want now and what you want most.", src: "Mindset wisdom" },
      { text: "Confidence comes from kept promises to yourself.", src: "Modern wisdom" },
      { text: "Strength does not come from physical capacity. It comes from indomitable will.", src: "Mahatma Gandhi" },
    ],
    good: [
      { text: "Use this energy. The best time to build forward is when momentum is on your side.", src: "Modern wisdom" },
      { text: "Faith is the head chemist of the mind. Believe and then act.", src: "Inspired by Napoleon Hill" },
      { text: "You are not your circumstances. You are your response to them.", src: "Stoic principle" },
      { text: "What lies behind us and what lies before us are tiny matters compared to what lies within us.", src: "Inspired by Emerson" },
      { text: "When you feel good, build the systems. They'll carry you through the days you don't.", src: "Modern wisdom" },
    ],
    cycle: [
      { text: "Your body has wisdom your willpower doesn't. Listen first, plan second.", src: "Modern wisdom" },
      { text: "Cycles are not weakness — they're rhythm. Honor where you are.", src: "Modern wisdom" },
      { text: "Rest is productive. So is softness. So is slowness.", src: "Modern wisdom" },
      { text: "What feels hard today might be easy in a week. Don't measure yourself by your hardest day.", src: "Modern wisdom" },
    ],
    unwell: [
      { text: "Healing is not linear. Today's job is to be gentle with yourself.", src: "Modern wisdom" },
      { text: "The body knows what to do. Your job is to get out of its way.", src: "Modern wisdom" },
      { text: "You are not behind. You are exactly where recovering people are.", src: "Modern wisdom" },
      { text: "Rest is not laziness. Rest is the work, today.", src: "Modern wisdom" },
    ],
    evening: [
      { text: "What did today teach you? Even a hard day taught you something.", src: "Reflection prompt" },
      { text: "You don't have to have done a lot. You only have to have done something.", src: "Modern wisdom" },
      { text: "Sleep is not the absence of work. It's where the work consolidates.", src: "Modern wisdom" },
      { text: "Tomorrow is a clean page. Tonight, just close the book.", src: "Modern wisdom" },
    ],
  };

  function pickAffirmation() {
    const t = getToday();
    const hour = new Date().getHours();
    const dayIdx = new Date().getDate();
    let pool;
    if (state.flags.unwell) pool = affirmations.unwell;
    else if (t.period === 'Period' || t.period === 'PMS') pool = affirmations.cycle;
    else if (t.mood === 1) pool = affirmations.heavy;
    else if (t.mood === 2) pool = affirmations.meh;
    else if (t.mood === 3) pool = affirmations.okay;
    else if (t.mood === 4) pool = affirmations.good;
    else if (hour < 11) pool = affirmations.morning;
    else if (hour >= 20) pool = affirmations.evening;
    else pool = affirmations.morning;
    return pool[dayIdx % pool.length];
  }

  function applyTheme() {
    const t = getToday();
    document.body.className = '';
    if (state.flags.unwell) { document.body.classList.add('unwell'); return; }
    if (t.period === 'Period' || t.period === 'PMS') { document.body.classList.add('cycle-period'); return; }
    if (t.mood === 1) document.body.classList.add('mood-heavy');
    else if (t.mood === 2) document.body.classList.add('mood-meh');
    else if (t.mood === 3) document.body.classList.add('mood-okay');
    else if (t.mood === 4) document.body.classList.add('mood-good');
  }

  const icons = {
    sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
    moon: '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
    refresh: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>',
    heart: '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
    activity: '<svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
    book: '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    droplet: '<svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>',
    trend: '<svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>',
    calendar: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
    settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
    download: '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
    upload: '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
    chevronLeft: '<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>',
    chevronRight: '<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>',
    x: '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>',
    cloud: '<svg viewBox="0 0 24 24"><path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/></svg>',
    wind: '<svg viewBox="0 0 24 24"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>',
    flame: '<svg viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>',
  };

  function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
  function escapeAttr(s) { return String(s ?? '').replace(/'/g, "\\'"); }

  function getGreeting() {
    const hour = new Date().getHours();
    if (state.flags.unwell) return "Be gentle.";
    if (hour < 6) return "Up early.";
    if (hour < 12) return "Good morning.";
    if (hour < 17) return "Good afternoon.";
    if (hour < 21) return "Good evening.";
    return "Winding down.";
  }
  function getContextChip() {
    const t = getToday();
    if (state.flags.unwell) return { label: 'Resting today', show: true };
    if (t.period === 'Period') return { label: 'Period · honor the rhythm', show: true };
    if (t.period === 'PMS') return { label: 'PMS · be gentle', show: true };
    if (t.mood === 1) return { label: 'Heavy day · one thing only', show: true };
    if (t.mood === 4) return { label: 'Good energy · build forward', show: true };
    return { show: false };
  }
  function getStatusLine(completed) {
    if (state.flags.unwell) {
      if (completed === 0) return "Rest is the work today.";
      return "You did something. That's enough.";
    }
    const t = getToday();
    if (t.mood === 1 || t.period === 'Period' || t.period === 'PMS') {
      if (completed === 0) return "Just one thing today, if any.";
      return `${completed} thing${completed > 1 ? 's' : ''} done. Gentle wins count too.`;
    }
    if (completed === 0) return "A blank page. No pressure.";
    if (completed < 3) return `${completed} thing${completed > 1 ? 's' : ''} logged. Keep it gentle.`;
    return `${completed} things logged. That counts.`;
  }

  // ============ HOME ============
  function HomeView() {
    const t = getToday();
    const date = new Date();
    const dateStr = date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    const aff = pickAffirmation();
    const chip = getContextChip();
    const completed = [t.nameIt, t.reset, t.win, t.mood != null, t.energy != null].filter(Boolean).length;
    const statusMsg = getStatusLine(completed);
    const hour = new Date().getHours();

    let primaryCards;
    if (hour < 11) primaryCards = ['nameIt', 'reset', 'win'];
    else if (hour < 18) primaryCards = ['reset', 'nameIt', 'win'];
    else primaryCards = ['win', 'reset', 'nameIt'];

    // Build 7-day strip
    const stripDays = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = d.toISOString().split('T')[0];
      const entry = state.entries[key];
      stripDays.push({
        key, dayLabel: d.getDate(),
        isToday: key === todayKey(),
        mood: entry?.mood, period: entry?.period
      });
    }

    return `
      <div class="wordmark-row">
        <div>
          <div class="wordmark">Mend<span class="wordmark-dot"></span></div>
          <div class="tagline">a place to land</div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" onclick="go('calendar')" aria-label="Calendar">${icons.calendar}</button>
          <button class="icon-btn" onclick="go('settings')" aria-label="Settings">${icons.settings}</button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="eyebrow">${getGreeting()}</div>
      <div class="greeting" style="margin-top: 6px;">${dateStr}</div>
      ${chip.show ? `<div class="context-line"><span class="context-dot"></span>${chip.label}</div>` : ''}
      <div class="date-sub">${statusMsg}</div>

      <div style="margin-top: 22px;">
        <div class="affirmation">
          <div class="affirmation-eyebrow">A thought for today</div>
          <div class="affirmation-text">${aff.text}</div>
          <div class="affirmation-source">— ${aff.src}</div>
        </div>
      </div>

      ${shouldShowBackupReminder() ? `
        <div class="backup-banner">
          <div class="backup-banner-icon">${icons.download}</div>
          <div class="backup-banner-text">
            <div class="backup-banner-title">Time for a backup</div>
            <div class="backup-banner-sub">${state.flags.lastBackup ? 'Last backup was over a week ago.' : "You haven't backed up yet."}</div>
          </div>
          <button class="backup-banner-btn" onclick="go('settings')">Back up</button>
        </div>
      ` : ''}

      <div class="strip-section">
        <div class="strip-label">
          <span class="strip-label-text">Past 7 days</span>
          <button class="strip-link" onclick="go('calendar')">See month →</button>
        </div>
        <div class="strip">
          ${stripDays.map(d => `
            <div class="strip-day ${d.isToday ? 'today' : ''} ${d.mood ? 'has-mood-' + d.mood : ''} ${d.period === 'Period' || d.period === 'PMS' ? 'has-cycle' : ''}" title="${d.key}">
              ${d.dayLabel}
            </div>
          `).join('')}
        </div>
      </div>

      <div class="stack">
        ${primaryCards.map(name => {
          if (name === 'nameIt') return card('nameIt', 'sun', 'What feels heavy today', t.nameIt ? 'Logged' : 'Morning · 2 min', !!t.nameIt);
          if (name === 'reset') return card('reset', 'refresh', 'Small reset', t.reset ? 'Did: ' + t.reset : 'Midday · 3 min', !!t.reset);
          if (name === 'win') return card('win', 'moon', 'One win', t.win ? 'Logged' : 'Night · 1 min', !!t.win);
        }).join('')}
      </div>

      <div class="section">
        <div class="eyebrow" style="margin-bottom: 10px;">Also track</div>
        <div class="stack">
          ${card('moodEnergy', 'heart', 'Mood & energy', (t.mood != null && t.energy != null) ? 'Logged' : 'Tap to log', t.mood != null && t.energy != null)}
          ${card('movement', 'activity', 'Movement', t.movement ? t.movement : 'Optional', !!t.movement)}
          ${card('reflect', 'book', 'Reflection', t.reflection ? 'Logged' : 'Prompt + journal', !!t.reflection)}
          ${card('cycle', 'droplet', 'Cycle', t.period ? t.period : 'Tap to log', !!t.period)}
        </div>
        <div class="unwell-toggle">
          <span>${state.flags.unwell ? "You're in rest mode today" : 'Not feeling well today?'}</span>
          <button onclick="toggleUnwell()">${state.flags.unwell ? 'Turn off' : 'Switch on'}</button>
        </div>
      </div>

      <div class="section">
        <button class="btn-primary" onclick="go('patterns')">
          <span style="display: inline-flex; align-items: center; gap: 8px;">
            ${icons.trend.replace('<svg', '<svg style="width:16px;height:16px;stroke:currentColor;stroke-width:1.5;fill:none;"')}
            See patterns
          </span>
        </button>
      </div>
    `;
  }

  function card(view, icon, title, status, complete) {
    return `
      <button class="card ${complete ? 'complete' : ''}" onclick="go('${view}')">
        <div class="card-row">
          <div class="icon-circle ${complete ? 'complete' : ''}">${icons[icon]}</div>
          <div>
            <div class="card-title">${title}</div>
            <div class="card-status">${escapeHtml(status)}</div>
          </div>
        </div>
        ${complete ? `<svg class="check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>` : ''}
      </button>
    `;
  }

  function backHeader(title) {
    return `
      <div class="back-header">
        <button class="back-btn" onclick="go('home')">${icons.chevronLeft}</button>
        <div class="h2">${title}</div>
      </div>
    `;
  }

  // ============ NAME IT ============
  function NameItView() {
    const t = getToday();
    return `
      ${backHeader('What feels heavy today')}
      <div class="body" style="margin-bottom: 18px;">
        One line. Don't fix it, don't solve it. Naming what's heavy takes power away from it.
      </div>
      <div class="input-card">
        <div class="input-label">Today, what's weighing on me is...</div>
        <textarea id="nameItInput" rows="3" placeholder="...the 9am meeting because I'm not prepared.">${escapeHtml(t.nameIt || '')}</textarea>
      </div>
      <button class="btn-accent" style="margin-top: 18px;" onclick="saveNameIt()">Save & done</button>
    `;
  }
  function saveNameIt() { updateToday({ nameIt: document.getElementById('nameItInput').value }); go('home'); }

  function ResetView() {
    const t = getToday();
    const isLowEnergy = state.flags.unwell || t.mood === 1 || t.period === 'Period' || t.period === 'PMS';
    const baseOptions = [
      { emoji: '🥄', label: 'Dishes in the sink', low: true },
      { emoji: '💌', label: 'Text someone I love', low: true },
      { emoji: '🚶', label: '10 pushups or 5-min walk', low: false },
      { emoji: '✨', label: 'Clear one surface', low: true },
    ];
    const options = isLowEnergy ? [...baseOptions].sort((a, b) => (b.low - a.low)) : baseOptions;
    return `
      ${backHeader('Small reset')}
      <div class="body" style="margin-bottom: 18px;">
        ${isLowEnergy ? 'Today, pick the smallest thing. Even a text counts.' : "Pick ONE. Small enough that \"too tired\" isn't valid."}
      </div>
      <div class="stack">
        ${options.map((o, i) => `
          <button class="reset-option ${t.reset === o.label ? 'selected' : ''} ${isLowEnergy && i === 0 ? 'recommended' : ''}" onclick="pickReset('${escapeAttr(o.label)}')">
            <span class="reset-emoji">${o.emoji}</span>
            <span class="reset-label">${o.label}</span>
            ${isLowEnergy && i === 0 && t.reset !== o.label ? '<span class="badge">Suggested</span>' : ''}
            ${t.reset === o.label ? `<svg style="width:18px;height:18px;stroke:var(--accent);stroke-width:2.5;fill:none;margin-left:auto;"><polyline points="20 6 9 17 4 12" transform="scale(0.75)"/></svg>` : ''}
          </button>
        `).join('')}
      </div>
      ${t.reset ? `<button class="btn-secondary" style="margin-top: 12px;" onclick="pickReset(null)">Clear</button>` : ''}
    `;
  }
  function pickReset(label) { updateToday({ reset: label }); if (label) setTimeout(() => go('home'), 200); }

  function WinView() {
    const t = getToday();
    return `
      ${backHeader('One win')}
      <div class="body" style="margin-bottom: 18px;">One thing you did today. Then tomorrow's likely dread, so it can't ambush you.</div>
      <div class="stack">
        <div class="input-card">
          <div class="input-label">Today's win</div>
          <textarea id="winInput" rows="2" placeholder="Sent that email I'd been avoiding.">${escapeHtml(t.win || '')}</textarea>
        </div>
        <div class="input-card">
          <div class="input-label">Tomorrow's likely dread</div>
          <textarea id="dreadInput" rows="2" placeholder="The Monday morning standup.">${escapeHtml(t.tomorrowDread || '')}</textarea>
        </div>
      </div>
      <button class="btn-accent" style="margin-top: 18px;" onclick="saveWin()">Save & done</button>
    `;
  }
  function saveWin() {
    updateToday({ win: document.getElementById('winInput').value, tomorrowDread: document.getElementById('dreadInput').value });
    go('home');
  }

  function MoodEnergyView() {
    const t = getToday();
    const moods = [
      { v: 1, label: 'Heavy', icon: 'cloud' },
      { v: 2, label: 'Meh', icon: 'wind' },
      { v: 3, label: 'Okay', icon: 'sun' },
      { v: 4, label: 'Good', icon: 'flame' },
    ];
    const energies = [{ v: 1, label: 'Drained' }, { v: 2, label: 'Low' }, { v: 3, label: 'Okay' }, { v: 4, label: 'Charged' }];
    return `
      ${backHeader('Mood & energy')}
      <div class="body" style="margin-bottom: 20px;">No right answer. Just notice.</div>
      <div class="eyebrow" style="margin-bottom: 10px;">Mood</div>
      <div class="tap-grid cols-4" style="margin-bottom: 22px;">
        ${moods.map(m => `
          <button class="tap ${t.mood === m.v ? 'active' : ''}" onclick="updateToday({mood: ${m.v}})">
            ${icons[m.icon].replace('<svg', `<svg style="stroke:${t.mood === m.v ? 'white' : 'var(--ink-soft)'}"`)}
            <span>${m.label}</span>
          </button>
        `).join('')}
      </div>
      <div class="eyebrow" style="margin-bottom: 10px;">Energy</div>
      <div class="tap-grid cols-4" style="margin-bottom: 22px;">
        ${energies.map(e => `
          <button class="tap ${t.energy === e.v ? 'active' : ''}" onclick="updateToday({energy: ${e.v}})" style="padding: 18px 6px;">
            <span style="font-size: 13px;">${e.label}</span>
          </button>
        `).join('')}
      </div>
      <button class="btn-accent" onclick="go('home')">Done</button>
    `;
  }

  function MovementView() {
    const t = getToday();
    const isLowEnergy = state.flags.unwell || t.mood === 1 || t.period === 'Period' || t.period === 'PMS';
    const allOptions = ['Rest day', 'Walk', 'Stretch', 'Yoga', 'Strength', 'Cardio', 'Other'];
    const recommended = isLowEnergy ? ['Rest day', 'Walk', 'Stretch', 'Yoga'] : [];
    return `
      ${backHeader('Movement')}
      <div class="body" style="margin-bottom: 18px;">
        ${isLowEnergy ? 'Your body is doing work already. Rest counts. Gentle counts.' : 'Rest counts. A walk counts. All of it counts.'}
      </div>
      <div class="opt-grid" style="margin-bottom: 18px;">
        ${allOptions.map(o => `
          <button class="opt ${t.movement === o ? 'active' : ''} ${recommended.includes(o) ? 'recommended' : ''}" onclick="updateToday({movement: '${escapeAttr(o)}'})">
            ${o}
            ${recommended.includes(o) && t.movement !== o ? '<span class="opt-dot"></span>' : ''}
          </button>
        `).join('')}
      </div>
      ${t.movement && t.movement !== 'Rest day' ? `
        <div class="input-card" style="margin-bottom: 18px;">
          <div class="input-label">Note (optional)</div>
          <textarea id="moveNote" rows="2" placeholder="20 min walk at lunch. Felt good." onblur="updateToday({movementNote: this.value})">${escapeHtml(t.movementNote || '')}</textarea>
        </div>
      ` : ''}
      <button class="btn-accent" onclick="saveMoveNote()">Done</button>
    `;
  }
  function saveMoveNote() { const el = document.getElementById('moveNote'); if (el) updateToday({ movementNote: el.value }); go('home'); }

  function ReflectView() {
    const t = getToday();
    const heavyPrompts = [
      "What's the smallest kindness I can offer myself right now?",
      "What would I tell a friend going through what I'm feeling?",
      "What am I making bigger in my head than it actually is?",
      "What can I let go of today, even just one thing?",
    ];
    const cyclePrompts = [
      "What is my body asking me for today?",
      "Where am I pushing when I could be flowing?",
      "What does honoring my rhythm look like this week?",
      "What softness can I offer myself today?",
    ];
    const standardPrompts = [
      "What's one thing I'm avoiding, and why?",
      "When did I feel most like myself today?",
      "What did I do today that I'm proud of, even if it's tiny?",
      "What's one small thing I'm grateful for right now?",
      "What boundary do I need to set this week?",
      "Where did my energy go today?",
      "What would change if I trusted myself more?",
      "What story am I telling myself that might not be true?",
    ];
    let prompts;
    if (state.flags.unwell || t.mood === 1) prompts = heavyPrompts;
    else if (t.period === 'Period' || t.period === 'PMS') prompts = cyclePrompts;
    else prompts = standardPrompts;
    const idx = new Date().getDate() % prompts.length;
    return `
      ${backHeader('Reflection')}
      <div class="prompt-card" style="margin-bottom: 14px;">
        <div class="eyebrow" style="margin-bottom: 6px; color: var(--accent-ink); opacity: 0.7;">Today's prompt</div>
        <div class="prompt-text">${prompts[idx]}</div>
      </div>
      <div class="input-card">
        <textarea id="reflectInput" rows="9" placeholder="Start anywhere. No need to be eloquent.">${escapeHtml(t.reflection || '')}</textarea>
      </div>
      <button class="btn-accent" style="margin-top: 18px;" onclick="saveReflect()">Save & done</button>
    `;
  }
  function saveReflect() { updateToday({ reflection: document.getElementById('reflectInput').value }); go('home'); }

  function CycleView() {
    const t = getToday();
    const phases = [
      { label: 'Period', desc: 'Flow', cls: 'phase-period' },
      { label: 'Spotting', desc: 'Light', cls: 'phase-spot' },
      { label: 'Follicular', desc: 'Post-period rise', cls: 'phase-foll' },
      { label: 'Ovulation', desc: 'Peak window', cls: 'phase-ovu' },
      { label: 'Luteal', desc: 'Pre-period', cls: 'phase-lut' },
      { label: 'PMS', desc: 'Symptoms hitting', cls: 'phase-pms' },
    ];
    return `
      ${backHeader('Cycle')}
      <div class="body" style="margin-bottom: 18px;">
        Cycle phase affects energy, mood, and capacity. Logging helps you spot the pattern, not push against it.
      </div>
      <div class="stack">
        ${phases.map(p => `
          <button class="phase-btn ${p.cls} ${t.period === p.label ? 'active' : ''}" onclick="updateToday({period: '${escapeAttr(p.label)}'})">
            <div>
              <div class="phase-label">${p.label}</div>
              <div class="phase-desc">${p.desc}</div>
            </div>
            ${t.period === p.label ? `<svg style="width:18px;height:18px;stroke:#fff;stroke-width:2.5;fill:none;"><polyline points="20 6 9 17 4 12" transform="scale(0.7)"/></svg>` : ''}
          </button>
        `).join('')}
      </div>
      ${t.period ? `<button class="btn-secondary" style="margin-top: 12px;" onclick="updateToday({period: null})">Clear</button>` : ''}
      <button class="btn-accent" style="margin-top: 12px;" onclick="go('home')">Done</button>
    `;
  }

  // ============ CALENDAR ============
  function CalendarView() {
    const m = state.calMonth;
    const year = m.getFullYear();
    const month = m.getMonth();
    const monthName = m.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();
    const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();

    let cells = '';
    for (let i = 0; i < firstDay; i++) cells += `<div class="cal-day empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(year, month, d);
      const key = date.toISOString().split('T')[0];
      const entry = state.entries[key];
      const isToday = key === todayKey();
      const isFuture = date > today;
      const moodClass = entry?.mood ? `has-mood-${entry.mood}` : '';
      const hasReset = !!entry?.reset;
      const hasReflection = !!entry?.reflection;
      const hasCycle = entry?.period === 'Period' || entry?.period === 'PMS';
      let dots = '';
      if (hasReset) dots += '<div class="cal-dot"></div>';
      if (hasReflection) dots += '<div class="cal-dot"></div>';
      if (hasCycle) dots += '<div class="cal-dot cycle"></div>';

      cells += `
        <button class="cal-day ${moodClass} ${isToday ? 'today' : ''}" ${isFuture ? 'disabled' : ''}
          onclick="selectDay('${key}')" style="${isFuture ? 'opacity:0.4;cursor:default;' : ''}">
          ${d}
          ${dots ? `<div class="cal-dots">${dots}</div>` : ''}
        </button>
      `;
    }

    const wd = ['S','M','T','W','T','F','S'];
    const totalLogged = Object.keys(state.entries).filter(k => k.startsWith(`${year}-${String(month+1).padStart(2,'0')}`)).length;

    return `
      ${backHeader('Calendar')}
      <div class="calendar-card">
        <div class="cal-header">
          <button class="cal-nav-btn" onclick="navMonth(-1)">${icons.chevronLeft}</button>
          <div class="cal-month">${monthName}</div>
          <button class="cal-nav-btn" onclick="navMonth(1)" ${isCurrentMonth ? 'disabled' : ''}>${icons.chevronRight}</button>
        </div>
        <div class="cal-weekdays">${wd.map(w => `<div class="cal-wd">${w}</div>`).join('')}</div>
        <div class="cal-grid">${cells}</div>
        <div class="cal-legend">
          <div class="legend-item"><div class="legend-swatch" style="background:#e0e7ff;"></div>Heavy</div>
          <div class="legend-item"><div class="legend-swatch" style="background:#cffafe;"></div>Meh</div>
          <div class="legend-item"><div class="legend-swatch" style="background:#fed7aa;"></div>Okay</div>
          <div class="legend-item"><div class="legend-swatch" style="background:#fde68a;"></div>Good</div>
          <div class="legend-item"><div class="legend-swatch" style="background:#fbcfe8;"></div>Cycle</div>
        </div>
      </div>

      ${state.selectedDay ? dayDetailCard(state.selectedDay) : ''}

      <div class="note-card">
        <span style="color: var(--ink); font-weight: 500;">${totalLogged} day${totalLogged !== 1 ? 's' : ''} logged this month.</span>
        Tap any day to see what you wrote.
      </div>
    `;
  }

  function navMonth(delta) {
    const newDate = new Date(state.calMonth);
    newDate.setMonth(newDate.getMonth() + delta);
    state.calMonth = newDate;
    state.selectedDay = null;
    render();
  }
  function selectDay(key) {
    state.selectedDay = state.selectedDay === key ? null : key;
    render();
  }

  function dayDetailCard(key) {
    const entry = state.entries[key] || {};
    const date = new Date(key + 'T00:00:00');
    const dateStr = date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    const moodLabels = { 1: 'Heavy', 2: 'Meh', 3: 'Okay', 4: 'Good' };
    const energyLabels = { 1: 'Drained', 2: 'Low', 3: 'Okay', 4: 'Charged' };

    const rows = [
      { label: 'Heavy', value: entry.nameIt },
      { label: 'Reset', value: entry.reset },
      { label: 'Win', value: entry.win },
      { label: 'Mood', value: entry.mood ? moodLabels[entry.mood] : null },
      { label: 'Energy', value: entry.energy ? energyLabels[entry.energy] : null },
      { label: 'Movement', value: entry.movement },
      { label: 'Cycle', value: entry.period },
      { label: 'Reflection', value: entry.reflection },
    ];

    const filledRows = rows.filter(r => r.value);
    return `
      <div class="day-detail">
        <div class="day-detail-header">
          <div class="day-detail-date">${dateStr}</div>
          <button class="day-detail-close" onclick="selectDay('${key}')">${icons.x}</button>
        </div>
        ${filledRows.length === 0 ? `
          <div style="text-align: center; padding: 20px 0; color: var(--ink-mute); font-style: italic; font-size: 13px;">
            Nothing logged this day.
          </div>
        ` : filledRows.map(r => `
          <div class="day-row">
            <div class="day-row-label">${r.label}</div>
            <div class="day-row-value">${escapeHtml(r.value)}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  // ============ SETTINGS / BACKUP ============
  function SettingsView() {
    const total = Object.keys(state.entries).length;
    const lastBackupStr = state.flags.lastBackup
      ? new Date(state.flags.lastBackup).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
      : 'Never';

    return `
      ${backHeader('Settings')}

      <div class="backup-section">
        <h3>Your data</h3>
        <p>All your entries live only on this device. No accounts, no servers. Total entries: <strong>${total}</strong>.</p>
        <div class="data-preview">
          Last backup: ${lastBackupStr}<br>
          Storage: this browser only
        </div>
      </div>

      <div class="backup-section">
        <h3>Export backup</h3>
        <p>Download all your entries as a JSON file. Save it to Google Drive, iCloud, or anywhere safe.</p>
        <button class="btn-accent" onclick="exportBackup()">
          <span style="display: inline-flex; align-items: center; gap: 8px;">
            ${icons.download.replace('<svg', '<svg style="width:16px;height:16px;stroke:currentColor;stroke-width:1.6;fill:none;"')}
            Export now
          </span>
        </button>
      </div>

      <div class="backup-section">
        <h3>Import backup</h3>
        <p>Restore from a previously exported file. Existing entries will be merged; same dates will be overwritten.</p>
        <button class="btn-outline" onclick="document.getElementById('importFile').click()">
          <span style="display: inline-flex; align-items: center; gap: 8px;">
            ${icons.upload.replace('<svg', '<svg style="width:16px;height:16px;stroke:currentColor;stroke-width:1.6;fill:none;"')}
            Choose file to import
          </span>
        </button>
      </div>

      <div class="backup-section">
        <h3>Reminders</h3>
        <div class="toggle-row" onclick="toggleReminder()">
          <div>
            <div class="toggle-row-label">Weekly backup reminder</div>
            <div class="toggle-row-sub">Banner appears every 7 days</div>
          </div>
          <div class="toggle ${state.flags.reminderOn ? 'on' : ''}"></div>
        </div>
      </div>

      <div class="note-card" style="margin-bottom: 14px;">
        <strong style="color: var(--ink);">How restore works:</strong> If you lose your phone or clear your browser, open Mend on the new device, tap Import, and pick your most recent backup file. Everything comes back instantly.
      </div>

      <button class="btn-outline" onclick="go('home')">Back</button>
    `;
  }

  function exportBackup() {
    const payload = {
      app: 'Mend',
      version: 3,
      exportedAt: new Date().toISOString(),
      entries: state.entries,
      flags: { reminderOn: state.flags.reminderOn },
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = todayKey();
    a.href = url;
    a.download = `mend-backup-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    state.flags.lastBackup = new Date().toISOString();
    saveFlags(state.flags);
    showToast('Backup saved to Downloads');
    render();
  }

  function toggleReminder() {
    state.flags.reminderOn = !state.flags.reminderOn;
    saveFlags(state.flags);
    render();
  }

  document.getElementById('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.entries) throw new Error('Not a Mend backup');
        const merged = { ...state.entries, ...data.entries };
        state.entries = merged;
        saveEntries(merged);
        showToast(`Imported ${Object.keys(data.entries).length} entries`);
        render();
      } catch (err) {
        showToast('Could not read that file');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2800);
  }

  // ============ PATTERNS ============
  function PatternsView() {
    const dates = Object.keys(state.entries).sort();
    const last14 = dates.slice(-14);
    const moodData = last14.map(d => state.entries[d]?.mood || null);
    const energyData = last14.map(d => state.entries[d]?.energy || null);
    const moveCount = dates.filter(d => state.entries[d]?.movement && state.entries[d].movement !== 'Rest day').length;
    const resetCount = dates.filter(d => state.entries[d]?.reset).length;
    const total = dates.length;

    if (total < 3) {
      return `
        ${backHeader('Patterns')}
        <div class="prompt-card" style="text-align: center; padding: 28px 18px;">
          <div class="prompt-text" style="font-size: 16px;">
            Patterns will show up here after a few days of logging.<br>
            <span style="opacity: 0.6; font-size: 13px; font-family: 'Inter', sans-serif; font-weight: 400;">${total} day${total !== 1 ? 's' : ''} so far.</span>
          </div>
        </div>
        <button class="btn-accent" style="margin-top: 18px;" onclick="go('home')">Back</button>
      `;
    }

    return `
      ${backHeader('Patterns')}
      <div class="stats-grid">
        <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">Days logged</div></div>
        <div class="stat"><div class="stat-num">${resetCount}</div><div class="stat-label">Resets done</div></div>
        <div class="stat"><div class="stat-num">${moveCount}</div><div class="stat-label">Active days</div></div>
      </div>
      <div class="chart-card">
        <div class="eyebrow" style="margin-bottom: 12px;">Last 14 days · mood</div>
        <div class="chart-bars">
          ${moodData.map(m => `<div class="chart-bar mood" style="height: ${m ? (m/4)*100 : 4}%; opacity: ${m ? 1 : 0.15};"></div>`).join('')}
        </div>
      </div>
      <div class="chart-card">
        <div class="eyebrow" style="margin-bottom: 12px;">Last 14 days · energy</div>
        <div class="chart-bars">
          ${energyData.map(e => `<div class="chart-bar energy" style="height: ${e ? (e/4)*100 : 4}%; opacity: ${e ? 1 : 0.15};"></div>`).join('')}
        </div>
      </div>
      <div class="note-card">
        <span style="color: var(--ink); font-weight: 500;">No streaks shown by design.</span> The point isn't an unbroken chain — it's that you keep coming back.
      </div>
      <button class="btn-accent" style="margin-top: 18px;" onclick="go('home')">Back</button>
    `;
  }

  // ============ RENDER ============
  function render() {
    applyTheme();
    const app = document.getElementById('app');
    let html = '';
    switch (state.view) {
      case 'home': html = HomeView(); break;
      case 'nameIt': html = NameItView(); break;
      case 'reset': html = ResetView(); break;
      case 'win': html = WinView(); break;
      case 'moodEnergy': html = MoodEnergyView(); break;
      case 'movement': html = MovementView(); break;
      case 'reflect': html = ReflectView(); break;
      case 'cycle': html = CycleView(); break;
      case 'patterns': html = PatternsView(); break;
      case 'calendar': html = CalendarView(); break;
      case 'settings': html = SettingsView(); break;
      default: html = HomeView();
    }
    app.innerHTML = html;
    window.scrollTo(0, 0);
  }

  render();
</script>
</body>
</html>
